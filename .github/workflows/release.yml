name: Release to Nuget

# Controls when the workflow will run
on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    steps:
    # Actions are pinned to a commit SHA rather than a mutable tag, so a compromised or retagged
    # release cannot silently change what runs here.
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0 # full history — the ancestry check below needs it
    - name: Verify commit exists in origin/main
      run: |
        git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/main
    # Without this the build depends on whichever SDK the runner image happens to ship, which for
    # net10.0 is not something to leave to chance. global.json pins the version.
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json
    - name: Set VERSION variable from tag
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:Version=${VERSION} -p:ContinuousIntegrationBuild=true
    # The integration tests skip themselves when no server is reachable, so this variable is what makes
    # them actually run rather than silently pass as skipped.
    - name: Test
      run: dotnet test --configuration Release --no-build
      env:
        MONGODB_CONNECTION_STRING: mongodb://localhost:27017
    # Packs the library project specifically, so the test project is not packed alongside it.
    # This also emits GeoIpServices.${VERSION}.snupkg, which the push step uploads automatically.
    - name: Pack
      run: dotnet pack GeoIpServices/GeoIpServices.csproj --configuration Release --no-build -p:Version=${VERSION} --output .
    # Exchanges a GitHub OIDC token for an API key valid for one hour, so no long-lived NuGet
    # credential has to be stored as a repository secret.
    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: globalpay
    - name: Push
      run: dotnet nuget push "GeoIpServices.${VERSION}.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
